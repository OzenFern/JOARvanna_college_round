services:
  - type: web
    name: agentbreak-backend
    env: python
    buildCommand: uv sync
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: '["https://agentbreak-frontend.onrender.com","http://localhost:3000","http://127.0.0.1:3000"]'
      - key: CORS_ORIGIN_REGEX
        value: 'https://[a-zA-Z0-9-]+\.vercel\.app'
