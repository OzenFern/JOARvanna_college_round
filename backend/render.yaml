services:
  - type: web
    name: agentbreak-backend
    env: python
    buildCommand: uv sync
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: '["https://agentbreak-frontend.onrender.com"]'
